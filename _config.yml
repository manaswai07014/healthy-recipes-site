title: Healthy Western Recipes
description: >-
  Low-calorie Mediterranean and Western recipes - every serving 400-600 kcal,
  with at least 15g protein. Developed, tested, and nutrition-verified by
  our editorial kitchen.
url: "https://healthy-recipes-site.pages.dev"
baseurl: ""
lang: en
timezone: Asia/Hong_Kong

permalink: /:title/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

twitter:
  username: healthyrecipes
  card: summary_large_image

social:
  name: Healthy Western Recipes
  links:
    - https://www.youtube.com/@healthyrecipes

author: Healthy Recipes Editorial
logo: /assets/logo.png

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  recipes:
    output: true
    permalink: /:year/:month/:day/:title/
  ingredients:
    output: true
    permalink: /ingredients/:path/
  cuisines:
    output: true
    permalink: /cuisines/:path/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe
      seo: false
  - scope:
      path: ""
      type: ingredients
    values:
      layout: ingredient_page
      seo: false

include:
  - _redirects
exclude:
  - _scripts
  - Gemfile
  - README.md
  - node_modules
  - vendor