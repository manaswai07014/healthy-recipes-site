title: Healthy Western Recipes
description: >-
  Low-calorie Mediterranean and Western recipes - every serving 400-600 kcal,
  with at least 15g protein. Developed, tested, and nutrition-verified by
  our editorial kitchen.
url: "https://waimind.com"
baseurl: ""
# W82 (2026-09-12): Migration to waimind.com custom domain.
# - Primary domain: waimind.com (老闆 custom domain)
# - Old subdomain: healthy-recipes-site.pages.dev (301 redirect to waimind.com)
# - Cross-domain redirect handled via _redirects file (Netlify format)
#
# 老闆 needs to do (CF Dashboard):
# 1. Pages > healthy-recipes-site > Custom domains
# 2. Add: waimind.com
# 3. Add: www.waimind.com
# 4. CF auto-generates Universal SSL
#
# DNS (waimind.com is on Cloudflare Registrar, so auto-configured)
lang: en
timezone: Asia/Hong_Kong

feed:
  path: feed.xml
  collections:
    recipes:
      path: feed.xml
      output: true

permalink: /:title/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

twitter:
  username: healthyrecipes
  card: summary_large_image

social:
  name: Healthy Western Recipes
  links:
    - https://www.youtube.com/@healthyrecipes

author: Healthy Recipes Editorial
logo: /assets/logo.png

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  recipes:
    output: true
    permalink: /:year/:month/:day/:title/
  ingredients:
    output: true
    permalink: /ingredients/:path/
  cuisines:
    output: true
    permalink: /cuisines/:path/
  categories:
    output: true
    permalink: /categories/:path/

defaults:
  # P62: All root pages (about, editorial-policy, ai-disclosure, etc.) MUST use default layout
  # Without explicit `layout: default`, Jekyll renders raw markdown with NO <head> tags —
  # 0 <title>, 0 meta description, 0 OG tags, 0 JSON-LD. Google won't index.
  # (Discovered 2026-09-06: live /about/ HTML had 0 <title> tags despite frontmatter having title.)
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe
      seo: false
  - scope:
      path: ""
      type: ingredients
    values:
      layout: ingredient_page
      seo: false

include:
  - _redirects
exclude:
  - _scripts
  - Gemfile
  - README.md
  - node_modules
  - vendor